# Step 8'de doldurulacak: GitHub Actions CI pipeline
# Python testleri (pytest) + TypeScript testleri (vitest) çalıştırır

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r data-pipeline/requirements.txt
      - name: Run pytest
        run: pytest data-pipeline/tests/

  typescript-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: simulator
        run: npm ci
      - name: Run Vitest
        working-directory: simulator
        run: npm test
